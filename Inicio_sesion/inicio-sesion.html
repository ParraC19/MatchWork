<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <link rel="stylesheet" href="/estilos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/imagenes/favicon.png" />
  </head>
  <body>
    <section class="login">
      <div class="inicio-sesion">
        <a href="/index.html">
          <img
            src="/imagenes/LogoMWblanco.png"
            alt="Logo.png"
            class="imagen-inicio-sesion"
          />
        </a>
        <form action="/index.html" method="get" class="form-inicio-sesion">
          <label for="correo">Correo Electronico:</label>
          <input type="email" id="correo" name="correo" required />
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required />
          <a href="/index.html" class="accion-sesion">
            <button class="botones boton-sesion">Entrar</button>
          </a>
        </form>
        <a href="/registros/resgistro.html">¿Olvidaste tu contraseña?</a>
      </div>
    </section>
  </body>
</html>
