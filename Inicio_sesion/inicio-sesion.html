<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="icon" href="/imagenes/favicon.png" />
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="m-0 p-0">
    <header class="m-0 p-0">
      <nav class="navbar navbar-expand-lg navbar-dark w-100">
        <div
          class="container-fluid d-flex flex-wrap align-items-center justify-content-between p-0"
        >
          <a class="navbar-brand child-header" href="/index.html">
            <img
              src="/imagenes/LogoMWblanco.png"
              class="logo-header"
              alt="MatchWork Logo"
            />
          </a>

          <form
            class="d-flex flex-grow-1 mx-3 child-header w-25 justify-content-center"
            role="search"
          >
            <input
              class="form-control w-50"
              type="search"
              placeholder="Buscar"
              aria-label="Buscar"
            />
          </form>

          <button
            class="navbar-toggler child-header border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav d-flex align-items-center">
              <li class="nav-item px-0">
                <a class="nav-link text-light b-radius-0" href="/index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item px-0">
                <a
                  class="nav-link text-light"
                  href="/match_center/match_center.html"
                  >Match Center</a
                >
              </li>
              <li class="nav-item px-0">
                <a
                  class="nav-link text-light"
                  href="/Inicio_sesion/inicio-sesion.html"
                  >Log In</a
                >
              </li>
              <li class="nav-item px-0">
                <a class="nav-link text-light" href="/registros/registro.html"
                  >Sign Up</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <section class="login">
      <div class="inicio-sesion">
        <a href="/index.html">
          <img
            src="/imagenes/LogoMWblanco.png"
            alt="Logo.png"
            class="imagen-inicio-sesion"
          />
        </a>
        <form action="/index.html" method="get" class="form-inicio-sesion">
          <label for="correo">Correo Electronico:</label>
          <input type="email" id="correo" name="correo" required />
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required />
          <a href="/index.html" class="accion-sesion">
            <button class="botones boton-sesion">Entrar</button>
          </a>
        </form>
        <a href="/registros/resgistro.html">¿Olvidaste tu contraseña?</a>
      </div>
    </section>
  </body>
</html>
